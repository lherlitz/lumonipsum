name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Run tests with coverage
      run: npm run test

    - name: Build
      run: npm run build

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install browsers
      run: npx @e2e-dev/web install chromium --with-deps

    - name: Run e2e tests
      run: npx e2e run --target chromium
      env:
        XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        GITHUB_TOKEN: ${{ github.token }}

    - name: Upload e2e artifacts
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: e2e-chromium
        path: .e2e/artifacts
        if-no-files-found: ignore

  smoke-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install browsers
      run: npx @e2e-dev/web install chromium firefox webkit --with-deps

    - name: Run smoke tests (chromium, firefox, webkit)
      run: npx e2e run --target chromium,firefox,webkit tests/core/initial-render.e2e.ts tests/compatibility/basic.e2e.ts
      env:
        XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        GITHUB_TOKEN: ${{ github.token }}

    - name: Upload e2e artifacts
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: e2e-smoke
        path: .e2e/artifacts
        if-no-files-found: ignore
